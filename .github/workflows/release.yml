name: Build and release song
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: song-release-v1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MPLCONFIGDIR: /tmp/chappy-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 mido==1.3.3
      - name: Generate and verify audio and MIDI
        run: |
          python create_song.py
          python validate_song.py
      - name: Package release
        run: |
          cp README.md create_song.py validate_song.py requirements.txt output/
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          out=Path('output')
          with zipfile.ZipFile('chappy_weppy_floppy.zip','w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for p in sorted(out.iterdir()):
                  if p.is_file(): z.write(p,str(p))
          assets=[Path('chappy_weppy_floppy.zip')]+sorted(out.glob('*.mid'))+[out/n for n in ['preview.mp3','instrumental.wav','guide_mix.wav','lyrics.txt','lyrics_timing.csv','README.md','song_overview.png','validation.json']]
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PY
      - name: Attach validated files and publish
        run: |
          if ! gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'チャッピー・ウェッピー・フロッピー v1.0.0' --notes-file RELEASE_NOTES.md --draft
          fi
          gh release upload v1.0.0 chappy_weppy_floppy.zip output/*.mid output/preview.mp3 output/instrumental.wav output/guide_mix.wav output/lyrics.txt output/lyrics_timing.csv output/README.md output/song_overview.png output/validation.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest --title 'チャッピー・ウェッピー・フロッピー v1.0.0' --notes-file RELEASE_NOTES.md
